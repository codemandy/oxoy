<!--
Revised Dark Favicon for Oxoy
A slightly softened dark-gray background with a bold white circular "O" outline and matching "X" inside.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Softer Dark Background -->
  <rect width="64" height="64" fill="#2E2"/>
  <!-- Outer circle representing "O" -->
  <circle cx="32" cy="32" r="28" stroke="#FFFFFF" stroke-width="8" fill="none"/>
  <!-- "X" inside -->
  <path d="M20,20 L44,44 M44,20 L20,44" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
</svg>
